# Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# hiltJavaCompileDebug doesn't route through the Java 21 toolchain and invokes javac
# on whatever JDK the Gradle daemon itself runs on; without this it defaults to JDK 17
# and fails with "invalid source release: 21" since compileOptions targets 21.
org.gradle.java.home=C:/Users/Charles/.jdks/jdk-21.0.11+10

# Android
android.useAndroidX=true
android.nonTransitiveR8=true
android.suppressUnsupportedCompileSdk=37.0

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# Fix Room/SQLite JDBC locking on Windows during kapt
kapt.include.compile.classpath=false
